name: Bug Report
description: File a bug report
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - jbulson
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!

  - type: input
    id: version
    attributes:
      label: Version
  description: What version of @mtngtools/unstorage are you running?
      placeholder: ex. 1.0.0
    validations:
      required: true

  - type: dropdown
    id: driver
    attributes:
      label: Driver
      description: Which driver are you using?
      options:
        - AWS S3
        - Other/Not applicable
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction Steps
      description: Steps to reproduce the behavior
      placeholder: |
        1. Create storage with '...'
        2. Call setItem with '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: code-sample
    attributes:
      label: Code Sample
      description: Minimal code sample that reproduces the issue
      render: typescript
      placeholder: |
        import { createStorage } from 'unstorage'
  import { awsS3Driver } from '@mtngtools/unstorage'
        
        // Your code here

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Please provide your environment details
      render: yaml
      placeholder: |
        OS: [e.g. macOS, Windows, Linux]
        Node.js version: [e.g. 18.17.0]
        Package manager: [e.g. npm, pnpm, yarn]
        AWS SDK version: [e.g. 3.423.0]

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell